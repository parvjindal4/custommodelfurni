name: Deploy to Replicate

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Maximize disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Cog
        run: |
          curl -fsSL -o /tmp/cog https://github.com/replicate/cog/releases/download/v0.13.2/cog_Linux_x86_64
          chmod +x /tmp/cog

      - name: Verify Replicate token
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          curl -sf -H "Authorization: Bearer $REPLICATE_API_TOKEN" https://api.replicate.com/v1/account || (echo "Token invalid!" && exit 1)

      - name: Login to Replicate registry
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          echo "$REPLICATE_API_TOKEN" | docker login -u token --password-stdin r8.im

      - name: Deploy to Replicate
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          /tmp/cog push r8.im/furnilabs13-del/megmentmask-furnivision
