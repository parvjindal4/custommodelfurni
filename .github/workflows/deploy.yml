name: Deploy to Replicate

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install Cog
        run: |
          curl -s https://github.com/replicate/cog/releases/download/v0.13.3/cog_Linux_x86_64.tar.gz | tar -xz -C /usr/local/bin/
          chmod +x /usr/local/bin/cog

      - name: Deploy to Replicate
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          /usr/local/bin/cog push r8.im/furnilabs13-del/megmentmask-furnivision
