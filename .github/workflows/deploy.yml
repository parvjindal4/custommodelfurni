name: Deploy to Replicate

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo apt-get remove -y '^ghc-8.*' || true
          sudo apt-get remove -y 'dotnet-.*' || true
          sudo apt-get autoremove -y || true
          sudo docker image prune -a -f
          df -h

      - name: Install Cog
        run: |
          curl -fsSL -o /tmp/cog https://github.com/replicate/cog/releases/download/v0.13.2/cog_Linux_x86_64
          chmod +x /tmp/cog

      - name: Deploy to Replicate
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: |
          /tmp/cog push r8.im/furnilabs13-del/megmentmask-furnivision
