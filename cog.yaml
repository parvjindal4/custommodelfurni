build:
  gpu: true
  cuda: "11.8"
  python_version: "3.10"
  python_packages:
    - torch==2.1.2
    - torchvision==0.16.2
    - numpy==1.24.4
    - Pillow==10.2.0
    - opencv-python-headless==4.9.0.80
    - matplotlib==3.8.2
    - supervision==0.19.0
    - transformers==4.38.2
    - accelerate==0.27.2
    - huggingface_hub==0.21.4
    - scipy==1.12.0
    - pycocotools==2.0.7

  run:
    - apt-get update && apt-get install -y git wget libgl1 libglib2.0-0
    - pip install git+https://github.com/facebookresearch/sam2.git
    - pip install git+https://github.com/IDEA-Research/GroundingDINO.git
    - mkdir -p /weights
    - wget -q -O /weights/sam2_hiera_large.pt https://dl.fbaipublicfiles.com/segment_anything_2/072824/sam2_hiera_large.pt
    - wget -q -O /weights/groundingdino_swinb.pth https://github.com/IDEA-Research/GroundingDINO/releases/download/v0.1.0-alpha2/groundingdino_swinb_cogcoor.pth
    - wget -q -O /weights/big-lama.pt https://huggingface.co/smartywu/big-lama/resolve/main/big-lama.pt

predict: "predict.py:Predictor"
